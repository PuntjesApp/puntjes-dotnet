name: Release

# release-please keeps a release PR open from the conventional commits on main. That PR merges itself when CI is
# green; the merge tags the version, and the publish job pushes the package to nuget.org with trusted publishing.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Let the release PR merge itself when CI is green
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$number" ]; then
            echo "release-please opened or updated no release PR in this run."
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash

  # Its own job, so "Re-run failed jobs" publishes again: release-please reports a release only once.
  publish:
    name: Publish to nuget.org
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing: nuget.org trades the OIDC token for a key that lives one hour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        run: dotnet pack src/Puntjes.Sdk --configuration Release --output artifacts
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Say what nuget.org needs
        if: failure() && steps.nuget.outcome == 'failure'
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          echo "::error::nuget.org refused the login for '${NUGET_USER}'. The account needs a trusted publishing policy for PuntjesApp/puntjes-dotnet, workflow release.yml (README, nuget.org trusted publishing), and the variable NUGET_USER must name it. Then re-run this job."
          exit 1
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # Tells #alerts in the Puntjes Slack that a release went out or failed. A push without a release says nothing.
  # The webhook is the organisation secret SLACK_RELEASE_WEBHOOK; a Slack failure never fails this job.
  slack:
    name: Tell Slack
    needs: [release-please, publish]
    if: ${{ !cancelled() && (needs.release-please.result == 'failure' || needs.release-please.outputs.released == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post the result
        env:
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RELEASE_RESULT: ${{ needs.release-please.result }}
          FOLLOW_UP_RESULT: ${{ needs.publish.result }}
          TAG: ${{ needs.release-please.outputs.tag }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RELEASE_RESULT" = 'success' ] && [ "$FOLLOW_UP_RESULT" = 'success' ]; then
            text=":package: ${REPO#*/} ${TAG} released. <${RUN_URL}|Workflow run>"
          else
            text=":x: ${REPO#*/} release ${TAG:-(no tag)} failed. Re-run the failed jobs. <${RUN_URL}|Workflow run>"
          fi
          if [ -z "${SLACK_RELEASE_WEBHOOK:-}" ]; then
            echo "::notice::No SLACK_RELEASE_WEBHOOK secret, so Slack gets no message."
            exit 0
          fi
          if ! jq -n --arg text "$text" '{text: $text}' |
            curl -sS --fail --max-time 10 -H 'Content-Type: application/json' -d @- "$SLACK_RELEASE_WEBHOOK" > /dev/null; then
            echo "::warning::Slack did not take the message."
          fi
