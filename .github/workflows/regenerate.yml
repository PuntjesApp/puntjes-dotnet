name: Regenerate

# PuntjesApp/Puntjes sends spec-published after a release publishes a new api.json to puntjes-openapi. This turns it
# into a PR with the regenerated client. A minor or patch PR merges itself when CI is green; a major one waits.
# A person can also start it by hand for a tag that is already published, as after a dispatch that failed.
on:
  repository_dispatch:
    types: [spec-published]
  workflow_dispatch:
    inputs:
      tag:
        description: A puntjes-openapi tag that is already published, as vX.Y.Z
        type: string
        required: true
      level:
        description: How far the spec moved from the one before it
        type: choice
        options: [major, minor, patch]
        required: true

permissions: {}

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate from the published spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write # the failure issue; the bot App has no issues permission
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the planner
        run: dotnet build tools/Puntjes.Tools --configuration Release --framework net10.0
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          LEVEL: ${{ github.event.client_payload.level || inputs.level }}
          URL: ${{ github.event.client_payload.url || format('https://raw.githubusercontent.com/PuntjesApp/puntjes-openapi/{0}/api.json', inputs.tag) }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName,title \
            --jq '.[] | select(.headRefName | startswith("regenerate/")) | "\(.headRefName) \(.title)"')
          dotnet run --project tools/Puntjes.Tools --configuration Release --framework net10.0 --no-build -- dispatch-plan "$TAG" "$LEVEL" "$URL" "$(cat spec/SOURCE)" "$open" >> "$GITHUB_OUTPUT"
      - name: Say why the dispatch is skipped
        if: steps.plan.outputs.skip == 'true'
        run: echo "::notice::spec/SOURCE or an open regenerate PR already has this tag or a newer one."
      - name: Find out how far an earlier run got
        id: state
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "::notice::PR #$pr exists for $BRANCH, so this dispatch was handled already."
            echo "stage=done" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::notice::$BRANCH exists without a PR, so this run opens the PR from it."
            echo "stage=resume" >> "$GITHUB_OUTPUT"
          else
            echo "stage=fresh" >> "$GITHUB_OUTPUT"
          fi
      # Builds on the newest main, not on the commit of the dispatch. A workflow edit merged on main during the run makes
      # GitHub refuse the branch (the App has no workflows permission), so a refused push runs again on the new tip.
      - name: Regenerate, commit and push
        if: steps.state.outputs.stage == 'fresh'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          URL: ${{ github.event.client_payload.url || format('https://raw.githubusercontent.com/PuntjesApp/puntjes-openapi/{0}/api.json', inputs.tag) }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TYPE: ${{ steps.plan.outputs.commit_type }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "$URL" -o "$RUNNER_TEMP/api.json"
          git config user.name "puntjes-sdk-bot[bot]"
          git config user.email "puntjes-sdk-bot[bot]@users.noreply.github.com"
          base=
          for attempt in 1 2 3; do
            git fetch --quiet --depth=1 origin main
            tip=$(git rev-parse FETCH_HEAD)
            if [ "$tip" = "$base" ]; then
              echo "::error::The push of $BRANCH was refused and main did not move, so another attempt cannot help."
              exit 1
            fi
            base=$tip
            git checkout --quiet --force -B "$BRANCH" "$tip"
            cp "$RUNNER_TEMP/api.json" spec/api.json
            echo "$TAG" > spec/SOURCE
            sh scripts/generate.sh
            git add spec src/Puntjes.Sdk/Generated
            git commit -m "${TYPE}: regenerate from puntjes-openapi ${TAG}"
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"; then
              exit 0
            fi
            echo "::warning::Attempt $attempt: the push of $BRANCH was refused. main may have moved, so this runs again on its tip."
          done
          echo "::error::main moved during each of the 3 attempts."
          exit 1
      - name: Open the PR
        if: steps.state.outputs.stage == 'fresh' || steps.state.outputs.stage == 'resume'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TYPE: ${{ steps.plan.outputs.commit_type }}
          AUTO_MERGE: ${{ steps.plan.outputs.auto_merge }}
        run: |
          set -- --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "${TYPE}: regenerate from puntjes-openapi ${TAG}" \
            --body "This client was regenerated from the published API spec ${TAG}. Never edit src/Puntjes.Sdk/Generated by hand."
          if [ "$AUTO_MERGE" != true ]; then
            set -- "$@" --reviewer cedricdhooge96
          fi
          gh pr create "$@"
          if [ "$AUTO_MERGE" = true ]; then
            gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --auto --squash
          fi
      - name: Close the open PRs for older tags
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.close != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          CLOSE: ${{ steps.plan.outputs.close }}
        run: |
          for branch in $CLOSE; do
            gh pr close "$branch" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "The spec ${TAG} replaces this one. Its regenerate PR holds every change of this PR."
          done
      - name: Make sure the open PR merges itself unless it is a major
        if: steps.state.outputs.stage == 'done'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.state.outputs.pr }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,title,autoMergeRequest \
            --jq 'if .state != "OPEN" then "closed" elif (.title | startswith("feat!:")) then "major"
              elif .autoMergeRequest == null then "manual" else "auto" end')
          if [ "$state" = manual ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
          fi
      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/regenerate-failed.md"
          tag='an invalid tag'
          if printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            tag="$TAG"
          fi
          printf 'The regenerate run for %s failed: %s\n\nA person must look at it. A re-run picks up where this run stopped.\n' \
            "$tag" "$RUN_URL" > "$body"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Regenerate failed"' \
            --json number,title --jq '[.[] | select(.title == "Regenerate failed")][0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Regenerate failed" --body-file "$body"
          fi
